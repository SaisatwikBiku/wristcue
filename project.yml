# XcodeGen spec. `xcodegen generate` turns this file into WristCue.xcodeproj.
# The generated project is committed too, so the repo opens in Xcode without
# installing XcodeGen. Edit this file, not the .xcodeproj, and regenerate.
name: WristCue

options:
  bundleIdPrefix: info.satwik
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Simulator only, no paid account: "-" means "Sign to Run Locally".
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  WristCueKit:
    path: Packages/WristCueKit

targets:
  WristCue:
    type: application
    platform: iOS
    sources:
      - WristCue
      # WCSessionTransport, shared with the Watch app.
      - Shared
    dependencies:
      - package: WristCueKit
      # Embeds the Watch app at WristCue.app/Watch, where installing the iPhone
      # app on a paired simulator also installs it on the Watch.
      - target: WristCueWatch
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: WristCue/Info.plist
      properties:
        CFBundleDisplayName: WristCue
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Keeps the audio session alive when the app is in the background or the
        # screen locks, which is what lets Now Playing controls work.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.satwik.wristcue
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: false
      testTargets:
        - WristCueUITests

  WristCueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WristCueUITests
    dependencies:
      - target: WristCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.satwik.wristcue.uitests
        TEST_TARGET_NAME: WristCue
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  WristCueWatch:
    type: application
    platform: watchOS
    sources:
      - WristCueWatch
      - Shared
    dependencies:
      - package: WristCueKit
      # The watch face complication, embedded in the Watch app's PlugIns folder.
      - target: WristCueComplication
    info:
      path: WristCueWatch/Info.plist
      properties:
        CFBundleDisplayName: WristCue
        # A single-target watchOS app (no WatchKit extension), paired with the
        # iPhone app below. WatchConnectivity only talks between companion apps.
        WKApplication: true
        WKCompanionAppBundleIdentifier: info.satwik.wristcue
    settings:
      base:
        # Must start with the iPhone app's bundle ID.
        PRODUCT_BUNDLE_IDENTIFIER: info.satwik.wristcue.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    scheme:
      gatherCoverageData: false

  WristCueComplication:
    type: app-extension
    platform: watchOS
    sources:
      - WristCueComplication
    info:
      path: WristCueComplication/Info.plist
      properties:
        CFBundleDisplayName: WristCue
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # Must start with the Watch app's bundle ID.
        PRODUCT_BUNDLE_IDENTIFIER: info.satwik.wristcue.watchkitapp.complication
        TARGETED_DEVICE_FAMILY: "4"

